[project]
name = "web-crawler"
version = "0.1.0"
description = "CS4422 IR Project 1 -- Web Crawler"
readme = "README.md"
authors = [
    { name = "Adrian Valcarcel-Schott", email = "avalsch@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "w3lib>=2.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
